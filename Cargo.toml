[package]
name = "drivewalker"
version = "0.2.0"
edition = "2024"
description = "Measure disk hotspots and clean regenerable files with explicit filesystem policies"
repository = "https://github.com/oxfern/drivewalker"
rust-version = "1.85"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dw"
path = "src/main.rs"
